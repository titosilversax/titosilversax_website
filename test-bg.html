<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Background Test</title>
  <style>
    body {
      margin: 0;
      background-color: red; /* If you see red, the image isn't loading */
      background-image: url('/images/background.webp');
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
      min-height: 100vh;
      color: white;
      font-family: sans-serif;
      padding: 40px;
    }
  </style>
</head>
<body>
  <h1>Background Image Test</h1>
  <p>If this page background shows the golden nebula, the image works.</p>
  <p>If the background is solid RED, the image failed to load.</p>
  <p>Image URL being tested: /images/background.webp</p>
</body>
</html>
